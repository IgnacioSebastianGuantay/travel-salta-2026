<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viaje Salta + Jujuy — Junio 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  /* ── DARK MODE (default) ── */
  :root {
    --bg:      #2C3440;
    --sidebar: #222b38;
    --border:  rgba(255,255,255,0.06);
    --text:    #F2E8D9;
    --sub:     #6B7280;
    --gold:    #D4A547;
    --divider: rgba(255,255,255,0.05);
    --hover:   rgba(255,255,255,0.05);
    --active:  rgba(196,98,58,0.2);
    --scroll:  rgba(255,255,255,0.1);
    --footer:  rgba(255,255,255,0.2);
    --hdr-bg:  rgba(0,0,0,0.25);
    --hdr-border: rgba(255,255,255,0.08);
    --popup-bg: #1e2b3c;
    --popup-border: rgba(255,255,255,0.12);
    --label-bg: rgba(18,26,38,0.85);
    --time-bg:  rgba(22,30,42,0.88);
  }
  /* ── LIGHT MODE ── */
  body.light {
    --bg:      #F0EDE6;
    --sidebar: #FDFAF6;
    --border:  rgba(0,0,0,0.08);
    --text:    #1a1a2e;
    --sub:     #5A5A6A;
    --gold:    #A07820;
    --divider: rgba(0,0,0,0.07);
    --hover:   rgba(0,0,0,0.04);
    --active:  rgba(196,98,58,0.12);
    --scroll:  rgba(0,0,0,0.15);
    --footer:  rgba(0,0,0,0.3);
    --hdr-bg:  rgba(255,255,255,0.7);
    --hdr-border: rgba(0,0,0,0.08);
    --popup-bg: #fff;
    --popup-border: rgba(0,0,0,0.12);
    --label-bg: rgba(255,252,248,0.92);
    --time-bg:  rgba(255,252,245,0.92);
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: background 0.3s, color 0.3s;
  }

  /* HEADER */
  header {
    padding: 14px 28px;
    border-bottom: 1px solid var(--hdr-border);
    display: flex;
    align-items: center;
    gap: 16px;
    background: var(--hdr-bg);
    flex-shrink: 0;
    transition: background 0.3s, border-color 0.3s;
  }
  header h1 { font-family:'Playfair Display',serif; font-size:20px; color:var(--text); flex:1; }
  header .subtitle { font-family:'DM Mono',monospace; font-size:10px; color:var(--gold); text-transform:uppercase; letter-spacing:2px; }

  /* TOGGLE BUTTON */
  .toggle-btn {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 6px 14px;
    border-radius: 20px;
    border: 1.5px solid var(--gold);
    background: transparent;
    color: var(--gold);
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.5px;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .toggle-btn:hover { background: var(--gold); color: #fff; }
  .toggle-btn--off { opacity: 0.45; }
  .toggle-icon { font-size: 14px; }

  /* LAYOUT */
  .layout { display:flex; flex:1; overflow:hidden; }

  /* SIDEBAR */
  .sidebar {
    width: 285px; min-width: 285px;
    background: var(--sidebar);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 0;
    transition: background 0.3s, border-color 0.3s;
  }
  .section-label {
    font-family:'DM Mono',monospace; font-size:9px;
    letter-spacing:2.5px; text-transform:uppercase;
    color:var(--gold); padding:12px 18px 7px;
  }
  .place-item {
    display:flex; align-items:flex-start; gap:10px;
    padding:8px 14px; cursor:pointer; border-radius:6px;
    margin:0 6px 2px; transition:background 0.15s;
  }
  .place-item:hover  { background: var(--hover); }
  .place-item.active { background: var(--active); }
  .num-circle {
    width:24px; height:24px; min-width:24px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family:'DM Mono',monospace; font-size:11px; font-weight:600;
    color:#fff; margin-top:1px; flex-shrink:0;
    box-shadow:0 1px 4px rgba(0,0,0,0.35);
  }
  .place-info h3   { font-size:13px; font-weight:500; color:var(--text); line-height:1.2; }
  .place-info .sub { font-size:10.5px; color:var(--sub); margin-top:1px; line-height:1.35; }
  .place-info .dist{ font-family:'DM Mono',monospace; font-size:9.5px; color:var(--gold); opacity:0.8; margin-top:2px; }
  .badge {
    display:inline-block; padding:1px 5px; border-radius:3px;
    font-size:8.5px; font-family:'DM Mono',monospace; letter-spacing:0.3px; margin-top:3px;
  }
  .divider { border:none; border-top:1px solid var(--divider); margin:6px 14px; }
  .footer-note { padding:12px 18px 0; font-family:'DM Mono',monospace; font-size:9px; color:var(--footer); line-height:1.7; }

  /* MAP */
  #map { flex:1; z-index:1; }

  /* POPUPS */
  .leaflet-popup-content-wrapper {
    background: var(--popup-bg) !important;
    border: 1px solid var(--popup-border) !important;
    border-radius: 8px !important;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3) !important;
    color: var(--text) !important;
  }
  .leaflet-popup-tip { background: var(--popup-bg) !important; }
  .leaflet-popup-content { margin:10px 14px; font-family:'DM Sans',sans-serif; }
  .popup-day   { font-family:'DM Mono',monospace; font-size:10px; color:var(--gold); letter-spacing:1px; }
  .popup-title { font-size:14px; font-weight:600; color:var(--text); margin:2px 0; }
  .popup-sub   { font-size:11px; color:var(--sub); }
  .popup-dist  { font-family:'DM Mono',monospace; font-size:10px; color:var(--gold); margin-top:3px; opacity:0.85; }

  .time-label { pointer-events:none !important; }
  .sidebar::-webkit-scrollbar { width:3px; }
  .sidebar::-webkit-scrollbar-track { background:transparent; }
  .sidebar::-webkit-scrollbar-thumb { background:var(--scroll); border-radius:2px; }

  /* POPUP ACCOMMODATION */
  .popup-divider { border:none; border-top:1px solid var(--popup-border); margin:7px 0; }
  .popup-accom-type {
    display:inline-block; padding:2px 7px; border-radius:4px;
    font-family:'DM Mono',monospace; font-size:9px; font-weight:600;
    letter-spacing:1px; text-transform:uppercase; margin-bottom:5px;
  }
  .popup-accom-type.hotel  { background:rgba(92,122,158,0.2); color:#5C7A9E; border:1px solid rgba(92,122,158,0.4); }
  .popup-accom-type.airbnb { background:rgba(255,90,96,0.15); color:#ff5a60; border:1px solid rgba(255,90,96,0.35); }
  .popup-accom-link {
    display:block; font-size:11px; color:var(--gold);
    text-decoration:none; margin-bottom:4px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:195px;
  }
  .popup-accom-link:hover { text-decoration:underline; }
  .popup-accom-row {
    display:flex; justify-content:space-between; gap:8px;
    font-family:'DM Mono',monospace; font-size:10px; color:var(--sub); margin-top:4px;
  }
  .popup-accom-row span:last-child { color:var(--text); }

  /* ── FLIGHT CARDS ── */
  .flight-card {
    margin: 2px 8px 6px;
    border-radius: 8px;
    background: rgba(212,165,71,0.07);
    border: 1px solid rgba(212,165,71,0.2);
    padding: 10px 12px 8px;
  }
  .flight-tag {
    font-family: 'DM Mono', monospace;
    font-size: 8.5px; letter-spacing: 1.8px;
    text-transform: uppercase; color: var(--sub);
    padding: 0 14px 4px;
  }
  .flight-route {
    display: flex; align-items: center;
    justify-content: space-between; gap: 6px;
    margin-bottom: 7px;
  }
  .flight-airport { text-align: center; }
  .flight-iata {
    font-family: 'DM Mono', monospace;
    font-size: 17px; font-weight: 500;
    color: var(--text); line-height: 1;
  }
  .flight-time {
    font-family: 'DM Mono', monospace;
    font-size: 12px; color: var(--gold); margin-top: 2px;
  }
  .flight-city { font-size: 9px; color: var(--sub); margin-top: 1px; }
  .flight-middle {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; gap: 3px;
  }
  .flight-arrow { display: flex; align-items: center; width: 100%; }
  .flight-line { flex: 1; border-top: 1.5px dashed rgba(212,165,71,0.3); }
  .flight-plane { font-size: 12px; color: var(--gold); opacity: 0.7; padding: 0 3px; }
  .flight-dur {
    font-family: 'DM Mono', monospace; font-size: 9px;
    color: var(--sub); letter-spacing: 0.3px;
  }
  .flight-meta {
    display: flex; justify-content: space-between; align-items: center;
    border-top: 1px solid var(--divider); padding-top: 6px;
    font-family: 'DM Mono', monospace;
  }
  .flight-date { font-size: 9.5px; color: var(--gold); letter-spacing: 1px; text-transform: uppercase; }
  .flight-airline { font-size: 9px; color: var(--sub); }

  /* ── RESPONSIVE MOBILE ── */
  .sidebar-handle { display:none; }

  @media (max-width:700px) {
    header {
      padding: 10px 14px;
      gap: 8px;
      flex-wrap: nowrap;
    }
    .header-text { flex:1; min-width:0; }
    header h1 {
      font-size: 15px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    header .subtitle { display: none; }
    .btn-text { display:none; }
    .toggle-btn { padding:6px 10px; flex-shrink:0; }

    .layout {
      flex: 1;
      min-height: 0;
    }

    #map {
      flex: 1;
      min-height: 0;
      width: 100%;
    }

    .sidebar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      width: 100%; min-width: unset;
      border-right: none;
      border-top: 1.5px solid var(--border);
      border-radius: 18px 18px 0 0;
      height: 72px;
      overflow: hidden;
      transition: height 0.35s cubic-bezier(0.4,0,0.2,1), background 0.3s, border-color 0.3s;
      z-index: 1000;
      padding: 0;
      box-shadow: 0 -4px 24px rgba(0,0,0,0.3);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .sidebar.open {
      height: 70vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .sidebar-handle {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 0 8px;
      cursor: pointer;
      flex-shrink: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      min-height: 56px;
      justify-content: center;
    }
    .handle-pill {
      width: 40px; height: 4px;
      background: var(--sub);
      border-radius: 2px;
      opacity: 0.5;
      margin-bottom: 6px;
    }
    .handle-label {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--gold);
      text-transform: uppercase;
    }
    .section-label { padding-top: 6px; }
    .place-item { padding: 10px 14px; }
    .place-info h3 { font-size: 14px; }
    .place-info .sub { font-size: 11.5px; }
    .footer-note { padding-bottom: calc(16px + env(safe-area-inset-bottom)); }
    .leaflet-popup-content-wrapper { font-size: 13px; }
    .popup-title { font-size: 13px; }

    /* Panel completamente oculto cuando el sidebar está cerrado */
    #panel-itin { display: none; }
    .sidebar.open #panel-itin { display: block; }

    /* Day tabs sticky: sin offset (no hay topbar en mobile) */
    #sbDayTabs { top: 0; }

    /* Day content con espacio para safe area */
    #sbDayContent { padding: 14px 14px calc(24px + env(safe-area-inset-bottom)); }

    /* Handle claramente tappable */
    .sidebar-handle { min-height: 64px; }
  }

  @media (max-width: 380px) {
    header h1 { font-size: 13px; }
    .toggle-btn { padding: 5px 8px; font-size: 10px; }
  }

  /* ── DAY ITINERARY MODAL ── */
  .day-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 3000;
    align-items: center;
    justify-content: center;
    padding: 20px;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }
  .day-overlay.open { display: flex; }
  .day-modal {
    background: var(--sidebar);
    border: 1px solid var(--border);
    border-radius: 16px;
    width: 100%; max-width: 500px;
    max-height: 85vh;
    display: flex; flex-direction: column;
    box-shadow: 0 20px 60px rgba(0,0,0,0.55);
    overflow: hidden;
    transition: background 0.3s, border-color 0.3s;
  }
  .day-modal-header {
    padding: 16px 20px 12px;
    border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
    flex-shrink: 0;
  }
  .day-modal-title {
    font-family: 'DM Mono', monospace;
    font-size: 10px; letter-spacing: 2px;
    text-transform: uppercase; color: var(--gold);
  }
  .day-modal-close {
    background: var(--hover); border: none;
    color: var(--sub); font-size: 15px; cursor: pointer;
    width: 30px; height: 30px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.15s;
  }
  .day-modal-close:hover { background: var(--border); }
  .day-tabs {
    display: flex; gap: 5px;
    padding: 10px 14px;
    overflow-x: auto; flex-shrink: 0;
    border-bottom: 1px solid var(--border);
    scrollbar-width: none;
  }
  .day-tabs::-webkit-scrollbar { display: none; }
  .day-tab {
    display: flex; flex-direction: column; align-items: center;
    padding: 7px 9px 6px; border-radius: 8px;
    border: 1px solid var(--border);
    cursor: pointer; min-width: 46px;
    background: transparent;
    transition: background 0.15s, border-color 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .day-tab:hover { background: var(--hover); }
  .day-tab.active { background: rgba(212,165,71,0.15); border-color: var(--gold); }
  .day-tab-num {
    font-family: 'DM Mono', monospace;
    font-size: 15px; font-weight: 500; color: var(--text); line-height: 1;
  }
  .day-tab.active .day-tab-num { color: var(--gold); }
  .day-tab-date {
    font-family: 'DM Mono', monospace;
    font-size: 8px; color: var(--sub); margin-top: 3px; white-space: nowrap;
  }
  .day-content {
    overflow-y: auto; padding: 18px 20px 28px; flex: 1;
  }
  .day-content::-webkit-scrollbar { width: 3px; }
  .day-content::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: 2px; }
  .day-content-date {
    font-family: 'DM Mono', monospace;
    font-size: 10px; color: var(--gold);
    letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 4px;
  }
  .day-content-title {
    font-family: 'Playfair Display', serif;
    font-size: 22px; color: var(--text); line-height: 1.2;
    margin-bottom: 18px;
  }
  .timeline { display: flex; flex-direction: column; }
  .timeline-item { display: flex; gap: 13px; }
  .timeline-left {
    display: flex; flex-direction: column; align-items: center;
    width: 36px; flex-shrink: 0;
  }
  .timeline-icon {
    width: 36px; height: 36px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0; z-index: 1;
  }
  .timeline-line {
    width: 2px; flex: 1; min-height: 10px;
    background: var(--border); margin: 3px 0;
  }
  .timeline-body { padding-bottom: 16px; flex: 1; min-width: 0; }
  .tl-type {
    font-family: 'DM Mono', monospace;
    font-size: 8.5px; letter-spacing: 1.5px;
    text-transform: uppercase; color: var(--sub); margin-bottom: 2px;
  }
  .tl-title { font-size: 14px; font-weight: 500; color: var(--text); line-height: 1.3; margin-bottom: 3px; }
  .tl-detail { font-size: 12px; color: var(--sub); line-height: 1.5; }

  @media (max-width: 700px) {
    .day-overlay { padding: 0; align-items: flex-end; }
    .day-modal { max-width: 100%; border-radius: 20px 20px 0 0; max-height: 90vh; }
    .day-content-title { font-size: 19px; }
  }

  /* ── SIDEBAR TOPBAR, TABS & COLLAPSE ── */
  .sidebar-topbar {
    display: flex; align-items: center;
    padding: 8px 10px; gap: 6px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    position: sticky; top: 0; z-index: 10;
    background: var(--sidebar);
    transition: background 0.3s, border-color 0.3s;
  }
  .sb-topbar-title {
    font-family: 'DM Mono', monospace;
    font-size: 10px; letter-spacing: 2px;
    text-transform: uppercase; color: var(--gold);
    flex: 1;
  }
  .collapse-btn {
    width: 28px; height: 28px; min-width: 28px; border-radius: 6px;
    border: 1px solid var(--border); background: transparent;
    color: var(--sub); font-size: 11px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s, color 0.15s; flex-shrink: 0;
  }
  .collapse-btn:hover { background: var(--hover); color: var(--text); }

  .sidebar.collapsed { width: 40px !important; min-width: 40px !important; }
  .sidebar.collapsed .sb-tabs,
  .sidebar.collapsed #panel-places,
  .sidebar.collapsed #panel-itin { display: none !important; }
  .sidebar.collapsed .sidebar-topbar {
    justify-content: center; border-bottom-color: transparent;
  }

  #panel-places { padding: 8px 0 24px; }
  #sbDayTabs {
    position: sticky; top: 44px; z-index: 9;
    background: var(--sidebar);
    border-bottom: 1px solid var(--border);
    transition: background 0.3s, border-color 0.3s;
  }
  #sbDayContent { padding: 16px 16px 28px; }

  #dayBtn { display: none; }
  @media (max-width: 700px) { .sidebar-topbar { display: none; } }

  @keyframes markerPop {
    0%   { transform: scale(1); }
    35%  { transform: scale(1.35); }
    65%  { transform: scale(0.9); }
    100% { transform: scale(1); }
  }
  .marker-pop { animation: markerPop 0.45s ease; }

  /* ── INFO PANEL (mobile bottom sheet) ── */
  .info-panel { display: none; }

  @media (max-width: 700px) {
    .info-panel {
      display: block;
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--popup-bg);
      border: 1px solid var(--popup-border);
      border-radius: 20px 20px 0 0;
      padding: 0 0 calc(16px + env(safe-area-inset-bottom));
      z-index: 1100;
      transform: translateY(110%);
      transition: transform 0.32s cubic-bezier(0.4,0,0.2,1);
      box-shadow: 0 -6px 32px rgba(0,0,0,0.35);
    }
    .info-panel.visible { transform: translateY(0); }

    .panel-drag {
      display: flex;
      justify-content: center;
      padding: 12px 0 4px;
    }
    .panel-drag-pill {
      width: 40px; height: 4px;
      background: var(--sub);
      border-radius: 2px;
      opacity: 0.4;
    }
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 4px 20px 12px;
      gap: 12px;
    }
    .panel-header-info { flex: 1; min-width: 0; }
    .panel-close {
      background: var(--hover);
      border: none;
      color: var(--sub);
      font-size: 16px;
      cursor: pointer;
      width: 32px; height: 32px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      margin-top: 2px;
      -webkit-tap-highlight-color: transparent;
    }
    .panel-body { padding: 0 20px; }
    .panel-day {
      font-family: 'DM Mono', monospace;
      font-size: 10px; color: var(--gold);
      letter-spacing: 1.5px; text-transform: uppercase;
      margin-bottom: 3px;
    }
    .panel-title {
      font-size: 20px; font-weight: 600;
      color: var(--text); line-height: 1.2;
      margin-bottom: 4px;
    }
    .panel-sub { font-size: 14px; color: var(--sub); line-height: 1.4; }
    .panel-dist {
      font-family: 'DM Mono', monospace;
      font-size: 11px; color: var(--gold);
      opacity: 0.85; margin-top: 5px;
    }
    .panel-divider { border: none; border-top: 1px solid var(--popup-border); margin: 14px 0; }
    .panel-accom-type {
      display: inline-block; padding: 3px 10px; border-radius: 5px;
      font-family: 'DM Mono', monospace; font-size: 10px; font-weight: 600;
      letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px;
    }
    .panel-accom-type.hotel  { background: rgba(92,122,158,0.2); color: #5C7A9E; border: 1px solid rgba(92,122,158,0.4); }
    .panel-accom-type.airbnb { background: rgba(255,90,96,0.15); color: #ff5a60; border: 1px solid rgba(255,90,96,0.35); }
    .panel-accom-name {
      display: block; font-size: 15px; font-weight: 500;

<script>
/* ── LOGIN ── */
const CRED_HASH = 'b6911b347e291d7ffb0c3180d4ace4065a045c42a7175905840b56513573460f';

(function() {
  if (sessionStorage.getItem('auth') === '1') {
    document.getElementById('loginOverlay').classList.add('hidden');
  }
})();

async function doLogin(e) {
  e.preventDefault();
  const user = document.getElementById('loginUser').value.trim().toLowerCase();
  const pass = document.getElementById('loginPass').value;
  const raw   = user + ':' + pass;
  const buf   = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(raw));
  const hash  = Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
  if (hash === CRED_HASH) {
    sessionStorage.setItem('auth', '1');
    document.getElementById('loginOverlay').classList.add('hidden');
  } else {
    document.getElementById('loginError').textContent = 'Usuario o contraseña incorrectos';
    document.getElementById('loginPass').value = '';
    document.getElementById('loginPass').focus();
  }
}

/* ── TILE LAYERS ── */
const darkTile  = 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png';

let timeLabelsVisible = false;

function toggleTimeLabels() {
  timeLabelsVisible = !timeLabelsVisible;

    if (timeLabelsVisible) t.marker.addTo(map);
    else map.removeLayer(t.marker);
  });
  const btn = document.getElementById('timeBtn');
  btn.classList.toggle('toggle-btn--off', !timeLabelsVisible);
}

/* ── TOGGLE MODE ── */
function toggleMode() {
  isDark = !isDark;
  const btn = document.getElementById('toggleBtn');

  map.removeLayer(currentLayer);
  currentLayer = L.tileLayer(isDark ? darkTile : lightTile, {
    attribution: attr, subdomains:'abcd', maxZoom:19
  }).addTo(map);
  currentLayer.bringToBack();

  document.body.classList.toggle('light', !isDark);

  btn.innerHTML = isDark
    ? '<span class="toggle-icon">☀️</span><span class="btn-text"> Modo claro</span>'

function makeTimeLabelHtml(label, lc) {
  const bg = isDark ? `rgba(22,30,42,0.88)` : `rgba(255,252,245,0.92)`;
  const textColor = isDark ? lc : lc;
  const borderColor = lc;
  return `<div style="
    background:${bg};
    border:1.5px solid ${borderColor};
    border-radius:12px;
    padding:3px 9px;
    font-family:'DM Mono',monospace;
    font-size:10px;
    font-weight:500;
    color:${textColor};
    white-space:nowrap;
    box-shadow:0 2px 8px rgba(0,0,0,0.25);
    letter-spacing:0.3px;
  ">🚗 ${label}</div>`;
}

function drawSegments() {
  // Draw lines
  segments.forEach(seg => {
    L.polyline(seg.points, {
      color: seg.color,
      weight: seg.dash ? 2 : 2.5,
      opacity: 0.65,
      dashArray: seg.dash
    }).addTo(map);

    const mid = [
      (seg.points[0][0] + seg.points[1][0]) / 2,
      (seg.points[0][1] + seg.points[1][1]) / 2,
    ];
    const icon = L.divIcon({ className:'time-label', html: makeTimeLabelHtml(seg.label, seg.lc), iconSize:null, iconAnchor:null });
    const m = L.marker(mid, { icon, interactive:false, keyboard:false });
    timeMarkers.push({ marker:m, label:seg.label, lc:seg.lc });
  });
}

function refreshTimeLabels() {
  timeMarkers.forEach(t => {
    t.marker.setIcon(L.divIcon({
      className:'time-label',
      html: makeTimeLabelHtml(t.label, t.lc),
      iconSize:null, iconAnchor:null

  });
}

/* ── INTERACTION ── */
function goTo(id) {
  const m = leafletMarkers.find(m => m.id === id);
  if (!m) return;
  const zoom = (id===0||id===1) ? 12 : id>=4 ? 11 : 10;
  map.flyTo([m.lat, m.lng], zoom, {duration:1.2});
  if (window.innerWidth <= 700) {
    setTimeout(() => openInfoPanel(m.place), 800);
    sidebarEl.classList.remove('open');
    handleLabel.textContent = 'Itinerario';
  } else {
    setTimeout(() => m.marker.openPopup(), 800);
  }
  setActive(id);
}

function setActive(id) {
  document.querySelectorAll('.place-item').forEach(el => el.classList.remove('active'));
  const el = document.getElementById('item-'+id);
  if (el) { el.classList.add('active'); el.scrollIntoView({behavior:'smooth',block:'nearest'}); }
}

const tlBg = {
  flight:  'rgba(92,122,158,0.22)',
  hotel:   'rgba(212,165,71,0.18)',
  drive:   'rgba(107,142,107,0.22)',
  explore: 'rgba(155,89,182,0.18)',
  bus:     'rgba(230,126,34,0.22)',
  note:    'rgba(196,98,58,0.18)',
};
const tlTypeLabel = {
  flight:'Vuelo', hotel:'Alojamiento', drive:'Traslado',
  explore:'Actividad', bus:'Transporte', note:'Info',
};

let currentDayIdx = 0;

function openDayModal(dayIdx = 0) {
  currentDayIdx = dayIdx;
  renderDayTabs();
  renderDayContent(dayIdx);
  document.getElementById('dayOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeDayModal() {
  document.getElementById('dayOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

function handleOverlayClick(e) {
  if (e.target === document.getElementById('dayOverlay')) closeDayModal();
}

function selectDay(idx) {
  currentDayIdx = idx;
  renderDayTabs();
  renderDayContent(idx);
  document.getElementById('dayContent').scrollTop = 0;
}

function renderDayTabs() {
  const container = document.getElementById('dayTabs');
  container.innerHTML = itinerary.map((d, i) => `
    <button class="day-tab${i === currentDayIdx ? ' active' : ''}" onclick="selectDay(${i})">
      <span class="day-tab-num">${d.day}</span>
      <span class="day-tab-date">${d.label}</span>
    </button>`).join('');
  // scroll active tab into view
  const activeBtn = container.children[currentDayIdx];
  if (activeBtn) activeBtn.scrollIntoView({ behavior:'smooth', block:'nearest', inline:'center' });
}

function renderDayContent(idx) {
  const d = itinerary[idx];
  const eventsHtml = d.events.map((ev, i) => `
    <div class="timeline-item">
      <div class="timeline-left">
        <div class="timeline-icon" style="background:${tlBg[ev.type]}">${ev.icon}</div>
        ${i < d.events.length - 1 ? '<div class="timeline-line"></div>' : ''}
      </div>
      <div class="timeline-body">
        <div class="tl-type">${tlTypeLabel[ev.type]}</div>
        <div class="tl-title">${ev.label}</div>
        <div class="tl-detail">${ev.detail}</div>
      </div>
    </div>`).join('');

  document.getElementById('dayContent').innerHTML = `
    <div class="day-content-date">${d.weekday} · ${d.date}</div>
    <div class="day-content-title">${d.title}</div>
    <div class="timeline">${eventsHtml}</div>`;
}

/* ── SIDEBAR COLLAPSE & TABS ── */
let sidebarCollapsed = false;

function toggleSidebar() {
  sidebarCollapsed = !sidebarCollapsed;
  sidebarEl.classList.toggle('collapsed', sidebarCollapsed);
  document.getElementById('collapseBtn').textContent = sidebarCollapsed ? '▶' : '◀';
  setTimeout(() => map.invalidateSize(), 320);
}

function highlightDayPlaces(ids) {
  leafletMarkers.forEach(m => {
    const active = ids.length === 0 || ids.includes(m.id);
    m.marker.setOpacity(active ? 1 : 0.15);
    if (active && ids.length > 0 && m.marker._icon) {
      const el = m.marker._icon;
      el.classList.remove('marker-pop');
      void el.offsetWidth;
      el.classList.add('marker-pop');
    }
  });
  if (!ids.length) return;
  const targets = leafletMarkers.filter(m => ids.includes(m.id));
  if (!targets.length) return;
  if (targets.length === 1) {
    map.flyTo([targets[0].lat, targets[0].lng], 11, { duration: 1.0 });
  } else {
    map.flyToBounds(targets.map(m => [m.lat, m.lng]), { padding:[60,60], duration:1.0, maxZoom:11 });
  }
}
